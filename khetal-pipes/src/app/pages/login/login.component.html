<app-navbar></app-navbar>

<section class="login-page">

  <div class="login-container">

    <!-- LEFT IMAGE SIDE -->
    <div class="image-section">

      <div class="image-overlay">

        <div class="brand-box">

          <div class="brand-logo">
            K
          </div>

          <h1>
            Khetal Pipes & Tubes
          </h1>

          <p>
            Trusted Steel & Hardware Partner
            Since 25+ Years
          </p>

        </div>

      </div>

    </div>


    <!-- RIGHT FORM SIDE -->
    <div class="form-section">

      <span class="form-tag">
        WELCOME BACK
      </span>

      <h2>
        Login Account
      </h2>

      <p class="subtitle">
        Sign in to continue
      </p>


      <!-- LOGIN FORM -->
      <form
        #loginForm="ngForm"
        (ngSubmit)="login()"
      >

        <!-- USERNAME -->
        <div class="input-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              id="password"
              name="password"
              [(ngModel)]="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="eye-btn"
              (click)="togglePassword()"
              [attr.aria-label]="
                showPassword
                  ? 'Hide password'
                  : 'Show password'
              "
            >

              @if (showPassword) {
                👁️
              } @else {
                👁️‍🗨️
              }

            </button>

          </div>

        </div>


        <!-- ERROR MESSAGE -->
        @if (errorMessage) {

          <div
            class="error-message"
            role="alert"
          >
            {{ errorMessage }}
          </div>

        }


        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          class="login-btn"
          [disabled]="!loginForm.valid"
        >
          Login
        </button>

      </form>


      <!-- REGISTER -->
      <div class="register-text">

        <span>
          Don't have an account?
        </span>

        <a routerLink="/register">
          Register
        </a>

      </div>

    </div>

  </div>

</section>


<app-footer></app-footer>
