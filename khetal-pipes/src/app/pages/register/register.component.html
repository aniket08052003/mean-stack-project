<app-navbar></app-navbar>


<section class="register-page">

  <div class="register-container">

    <!-- LEFT IMAGE SIDE -->

    <div class="image-section">

      <div class="image-overlay">

        <div class="brand-box">

          <div class="brand-logo">
            K
          </div>

          <h1>
            Khetal Pipes & Tubes
          </h1>

          <p>
            Trusted Steel & Hardware Partner
            Since 25+ Years
          </p>

        </div>

      </div>

    </div>


    <!-- RIGHT FORM SIDE -->

    <div class="form-section">

      <span class="form-tag">
        GET STARTED
      </span>

      <h2>
        Create Account
      </h2>

      <p class="subtitle">
        Register to get started with Khetal Pipes & Tubes
      </p>


      <form
        #registerForm="ngForm"
        (ngSubmit)="register()"
      >

        <!-- NAME -->

        <div class="input-group">

          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            name="name"
            [(ngModel)]="name"
            placeholder="Enter your full name"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="input-group">

          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              id="password"
              name="password"
              [(ngModel)]="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Create a password"
              required
            >

            <button
              type="button"
              class="eye-btn"
              (click)="togglePassword()"
            >

              @if (showPassword) {
                👁️
              } @else {
                👁️‍🗨️
              }

            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-box">

            <input
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Confirm your password"
              required
            >

            <button
              type="button"
              class="eye-btn"
              (click)="toggleConfirmPassword()"
            >

              @if (showConfirmPassword) {
                👁️
              } @else {
                👁️‍🗨️
              }

            </button>

          </div>

        </div>


        <!-- REGISTER BUTTON -->

        <button
          type="submit"
          class="register-btn"
          [disabled]="!registerForm.valid"
        >
          Create Account
        </button>

      </form>


      <!-- LOGIN LINK -->

      <div class="login-text">

        <span>
          Already have an account?
        </span>

        <a routerLink="/login">
          Login
        </a>

      </div>

    </div>

  </div>

</section>


<app-footer></app-footer>
